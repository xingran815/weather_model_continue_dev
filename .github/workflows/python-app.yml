name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Run ruff check
      run: ruff check src/

    - name: Run ruff format check
      run: ruff format --check src/

  type-check:
    name: Type Check with mypy
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mypy
        pip install -e ".[dev]"

    - name: Run mypy
      run: mypy src/ --install-types --non-interactive || true

  test:
    name: Test with pytest
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests with coverage
      run: |
        pytest src/tests/ --cov=src --cov-report=xml --cov-report=term --cov-fail-under=60

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

    - name: Display coverage summary
      run: |
        pip install coverage
        coverage report --show-missing

  docker-build:
    name: Build and Scan Docker Images
    runs-on: ubuntu-latest
    needs: [test]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build model service image
      run: |
        docker build -f docker_images/Dockerfile_model -t weather-model:test .

    - name: Build MLflow image
      run: |
        docker build -f docker_images/Dockerfile_mlflow -t weather-mlflow:test .

    - name: Build Streamlit image
      run: |
        docker build -f docker_images/Dockerfile_streamlit -t weather-streamlit:test .

    - name: Build MySQL image
      run: |
        docker build -f docker_images/Dockerfile_sql -t weather-mysql:test .

    - name: Install Trivy
      run: |
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy -y

    - name: Scan model image with Trivy
      run: |
        trivy image --severity HIGH,CRITICAL --exit-code 0 weather-model:test

    - name: Scan MLflow image with Trivy
      run: |
        trivy image --severity HIGH,CRITICAL --exit-code 0 weather-mlflow:test

    - name: Scan Streamlit image with Trivy
      run: |
        trivy image --severity HIGH,CRITICAL --exit-code 0 weather-streamlit:test

    - name: Scan MySQL image with Trivy
      run: |
        trivy image --severity HIGH,CRITICAL --exit-code 0 weather-mysql:test

    - name: Save Docker images as artifacts
      run: |
        docker save weather-model:test -o model-image.tar
        docker save weather-mlflow:test -o mlflow-image.tar

    - name: Upload Docker images
      uses: actions/upload-artifact@v4
      with:
        name: docker-images
        path: |
          model-image.tar
          mlflow-image.tar
        retention-days: 1

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
    - uses: actions/checkout@v4

    - name: Create .env file
      run: |
        cp .env.example .env

    - name: Start services with docker-compose
      run: |
        docker-compose up -d mysql mlflow

    - name: Wait for services to be ready
      run: |
        echo "Waiting for MySQL to be ready..."
        timeout 60 bash -c 'until docker-compose exec -T mysql mysqladmin ping -h localhost --silent; do sleep 2; done' || true
        echo "Waiting for MLflow to be ready..."
        sleep 10

    - name: Check service health
      run: |
        docker-compose ps
        docker-compose logs mysql
        docker-compose logs mlflow

    - name: Stop services
      if: always()
      run: |
        docker-compose down -v
